[project]
name = "portscan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.6.0",
    "pytest>=9.2.0",
]

[project.scripts]
portscan = "portscan.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
